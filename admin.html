<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111214">
  <title>상품 관리 · KT 금왕점</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --red:#E60012; --red-dark:#B8000E; --ink:#111214; --ink-2:#3b3f45; --muted:#6b7178; --line:#e3e5e8; --bg:#f3f4f6; --card:#fff; --ok:#0a7a35; --ok-bg:#e8f7ee; --warn:#9a6400; --warn-bg:#fff4d6; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif; font-size:16px; line-height:1.5; word-break:keep-all; }
    body.lock { overflow:hidden; }
    button, input, select, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    [hidden] { display:none !important; }
    .wrap { max-width:960px; margin:0 auto; padding:0 16px; }

    /* top */
    .top { position:sticky; top:0; z-index:10; background:var(--ink); color:#fff; padding-top:env(safe-area-inset-top); }
    .top-in { display:flex; align-items:center; gap:10px; height:58px; }
    .top h1 { margin:0 auto 0 0; font-size:17px; display:flex; align-items:center; gap:8px; }
    .top h1 svg { width:30px; height:auto; color:#fff; }
    .tbtn { height:36px; padding:0 12px; border-radius:9px; border:1px solid rgba(255,255,255,.2); background:transparent; color:#fff; font-size:14px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; }

    .btn { height:48px; padding:0 18px; border-radius:12px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
    .btn-red { background:var(--red); border-color:var(--red); color:#fff; }
    .btn-red:active { background:var(--red-dark); }
    .btn-dark { background:var(--ink); border-color:var(--ink); color:#fff; }
    .btn-ghost { background:transparent; }
    .btn-danger { color:var(--red); border-color:#f3c3c7; background:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn-block { width:100%; }

    /* login */
    .login { min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
    .login-card { width:100%; max-width:380px; background:#fff; border-radius:20px; padding:30px 24px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
    .login-card h2 { margin:14px 0 4px; font-size:22px; }
    .login-card p { margin:0 0 20px; color:var(--muted); font-size:14.5px; }
    .login-card .kt { width:52px; color:var(--ink); }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .field > span { font-size:14px; font-weight:700; color:var(--ink-2); }
    .field small { font-weight:500; color:var(--muted); font-size:12.5px; }
    .input { width:100%; height:50px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:16px; }
    textarea.input { height:auto; min-height:84px; padding:12px 14px; resize:vertical; }
    .input:focus { outline:2px solid var(--ink); outline-offset:-1px; }
    .msg { margin:12px 0 0; padding:10px 12px; border-radius:10px; font-size:14px; }
    .msg.err { background:#fdecee; color:var(--red-dark); }
    .msg.ok { background:var(--ok-bg); color:var(--ok); }
    .linkbtn { border:0; background:none; padding:6px 0; color:var(--muted); font-size:14px; text-decoration:underline; }
    .login-links { display:flex; justify-content:space-between; margin-top:12px; }

    /* dashboard */
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
    .stat { background:#fff; border-radius:14px; padding:12px 14px; border:2px solid transparent; text-align:left; }
    .stat b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
    .stat span { font-size:13px; color:var(--muted); font-weight:600; }
    .stat.on { border-color:var(--ink); }
    .bar { display:flex; gap:8px; margin-bottom:12px; }
    .bar .input { height:46px; }
    .add-btn { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:9; height:58px; padding:0 22px; border-radius:999px; box-shadow:0 10px 24px rgba(230,0,18,.35); font-size:17px; }
    .list { display:flex; flex-direction:column; gap:10px; padding-bottom:110px; }
    .item { display:grid; grid-template-columns:84px 1fr; gap:12px; background:#fff; border-radius:16px; padding:12px; }
    .item-img { width:84px; height:84px; border-radius:12px; object-fit:cover; background:#eceef0; display:grid; place-items:center; font-size:12px; color:var(--muted); }
    .item-main { min-width:0; }
    .item-top { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600; }
    .item h3 { margin:2px 0 0; font-size:17px; line-height:1.3; }
    .item .spec { font-size:13.5px; color:var(--muted); }
    .item .price { font-weight:800; font-size:17px; margin-top:2px; }
    .item-actions { grid-column:1/-1; display:flex; gap:6px; }
    .seg { display:flex; flex:1; background:var(--bg); border-radius:10px; padding:3px; gap:3px; }
    .seg button { flex:1; height:36px; border:0; border-radius:8px; background:transparent; font-size:13.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
    .seg button.on[data-v="sale"] { background:var(--ok-bg); color:var(--ok); }
    .seg button.on[data-v="reserved"] { background:var(--warn-bg); color:var(--warn); }
    .seg button.on[data-v="sold"] { background:#dfe1e4; color:var(--ink-2); }
    .seg button.on.plain { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
    .edit-btn { height:42px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:14px; }
    .gtag { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:6px; color:#fff; font-size:12px; font-weight:800; }
    .g-S { background:#111214; } .g-A { background:#2563eb; } .g-B { background:#0d9488; } .g-C { background:#9ca3af; }
    .empty { text-align:center; padding:48px 16px; color:var(--muted); background:#fff; border-radius:16px; }

    /* editor sheet */
    .sheet { position:fixed; inset:0; z-index:50; background:var(--bg); overflow:auto; -webkit-overflow-scrolling:touch; }
    .sheet-top { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
    .sheet-top .wrap { display:flex; align-items:center; gap:10px; height:58px; }
    .sheet-top h2 { margin:0 auto 0 0; font-size:18px; }
    .x { width:42px; height:42px; border:0; border-radius:50%; background:var(--bg); font-size:18px; }
    .sec { background:#fff; border-radius:16px; padding:18px 16px; margin:12px 0; }
    .sec h3 { margin:0 0 12px; font-size:16px; display:flex; align-items:center; gap:8px; }
    .sec h3 .n { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; font-size:12px; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font-weight:600; font-size:14.5px; }
    .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
    .swatches { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .sw { width:34px; height:34px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
    .sw.on { box-shadow:0 0 0 2px var(--ink); }
    .grades { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .grade { text-align:left; padding:12px; border-radius:12px; border:2px solid var(--line); background:#fff; }
    .grade b { display:flex; align-items:center; gap:8px; font-size:15px; }
    .grade small { display:block; margin-top:4px; color:var(--muted); font-size:12.5px; line-height:1.4; }
    .grade.on { border-color:var(--ink); background:#fafafa; }
    .photos { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
    .ph { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:#eceef0; }
    .ph img { width:100%; height:100%; object-fit:cover; display:block; }
    .ph .main { position:absolute; left:6px; top:6px; padding:2px 7px; border-radius:6px; background:var(--red); color:#fff; font-size:11px; font-weight:800; }
    .ph .ctl { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; padding:4px; background:linear-gradient(transparent, rgba(0,0,0,.55)); }
    .ph .ctl button { width:30px; height:30px; border:0; border-radius:8px; background:rgba(255,255,255,.92); font-size:14px; font-weight:800; }
    .ph .prog { position:absolute; inset:0; display:grid; place-items:center; background:rgba(255,255,255,.7); font-weight:800; font-size:14px; }
    .ph-add { aspect-ratio:1; border-radius:12px; border:2px dashed #c9ccd1; background:#fafafa; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-weight:700; font-size:13.5px; color:var(--ink-2); cursor:pointer; }
    .ph-add svg { width:28px; height:28px; }
    .hint { font-size:13px; color:var(--muted); margin:8px 0 0; }
    .money { position:relative; }
    .money .input { padding-right:36px; font-variant-numeric:tabular-nums; font-weight:700; }
    .money::after { content:'원'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; }
    .quick { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
    .quick button { height:32px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:700; }
    .save-preview { margin-top:10px; padding:10px 12px; border-radius:10px; background:#fdecee; color:var(--red); font-weight:700; font-size:14px; }
    .range { width:100%; accent-color:var(--ink); }
    .check { display:flex; align-items:center; gap:10px; margin-top:10px; font-weight:600; font-size:15px; }
    .check input { width:22px; height:22px; accent-color:var(--ink); }
    .sheet-foot { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 0 calc(10px + env(safe-area-inset-bottom)); }
    .sheet-foot .wrap { display:flex; gap:8px; }
    .sheet-foot .btn-red { flex:1; }
    .toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:100; padding:12px 18px; border-radius:12px; background:var(--ink); color:#fff; font-weight:600; font-size:15px; max-width:calc(100% - 32px); }
    .confirm-bg { position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.5); display:grid; place-items:center; padding:16px; }
    .confirm { background:#fff; border-radius:18px; padding:22px; max-width:360px; width:100%; }
    .confirm p { margin:0 0 18px; font-weight:600; }
    .confirm .acts { display:flex; gap:8px; }
    .confirm .acts .btn { flex:1; }
    @media (min-width:760px) {
      .list { display:grid; grid-template-columns:1fr 1fr; }
      .grades { grid-template-columns:repeat(4,1fr); }
    }
  </style>
</head>
<body>

<!-- 로그인 -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <svg class="kt" viewBox="0 0 69.73 56.89" aria-label="kt"><path fill="currentColor" d="M22.25,33.92l16.05-19.75h-8.75c-3.93,0-6.62,1.2-9.01,3.99l-8.45,10.39V0H3.61C1.62,0,0,1.62,0,3.62v53.27h8.48c2,0,3.61-1.62,3.61-3.62v-14.17l6.87,8.43,5.84,7.19c1.18,1.48,2.73,2.16,4.32,2.16h11.83l-7.65-9.39-11.05-13.58ZM59.34,46.84c-1.78,0-3.24-1.46-3.24-3.25V0h-8.48c-1.99,0-3.62,1.62-3.62,3.61v42.25c0,6.53,4.51,11.03,11.04,11.03h9.32c2,0,3.62-1.62,3.62-3.62v-6.44h-8.64Z"/><path fill="#ED1C24" d="M69.73,19.04v-8.02s-.75.79-.75.79c-.03.01-2.3,2.33-8.82,2.33h-30.83c-4.87,0-7.17,1.98-8.91,4.13l-.95,1.17s-.06.07-.09.1l-6.12,7.53c2.23-1.68,5.27-2.69,8.38-2.69h38.51c4.67,0,9.16-1.37,9.53-4.87.05-.29.04-.47.04-.47Z"/></svg>
    <h2 id="loginTitle">관리자 로그인</h2>
    <p id="loginDesc">KT 금왕점 중고폰 상품 관리</p>
    <label class="field"><span>이메일</span><input class="input" id="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>비밀번호</span><input class="input" id="password" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="btn btn-red btn-block" id="loginBtn" type="submit">로그인</button>
    <div class="msg" id="loginMsg" hidden></div>
    <div class="login-links">
      <button type="button" class="linkbtn" id="toggleSignup">처음이세요? 계정 만들기</button>
      <button type="button" class="linkbtn" id="resetPw">비밀번호 찾기</button>
    </div>
  </form>
</section>

<!-- 설정 안 됨 -->
<section class="login" id="setupView" hidden>
  <div class="login-card">
    <h2>아직 연결 전이에요</h2>
    <p>js/config.js 에 Supabase 주소와 키가 들어가면 이 화면에서 바로 상품을 관리할 수 있어요.</p>
  </div>
</section>

<!-- 관리 화면 -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap top-in">
      <h1><svg viewBox="0 0 69.73 56.89" aria-hidden="true"><path fill="currentColor" d="M22.25,33.92l16.05-19.75h-8.75c-3.93,0-6.62,1.2-9.01,3.99l-8.45,10.39V0H3.61C1.62,0,0,1.62,0,3.62v53.27h8.48c2,0,3.61-1.62,3.61-3.62v-14.17l6.87,8.43,5.84,7.19c1.18,1.48,2.73,2.16,4.32,2.16h11.83l-7.65-9.39-11.05-13.58ZM59.34,46.84c-1.78,0-3.24-1.46-3.24-3.25V0h-8.48c-1.99,0-3.62,1.62-3.62,3.61v42.25c0,6.53,4.51,11.030,11.04,11.03h9.32c2,0,3.62-1.62,3.62-3.62v-6.44h-8.64Z"/><path fill="#ED1C24" d="M69.73,19.04v-8.02s-.75.79-.75.79c-.03.01-2.3,2.33-8.82,2.33h-30.83c-4.87,0-7.17,1.98-8.91,4.13l-.95,1.17s-.06.07-.09.1l-6.12,7.53c2.23-1.68,5.27-2.69,8.38-2.69h38.51c4.67,0,9.16-1.37,9.53-4.87.05-.29.04-.47.04-.47Z"/></svg>상품 관리</h1>
      <a class="tbtn" href="index.html" target="_blank" rel="noopener">사이트 보기</a>
      <button class="tbtn" id="logoutBtn">로그아웃</button>
    </div>
  </header>
  <main class="wrap">
    <div class="stats" id="stats">
      <button class="stat" data-f="sale"><b id="cSale">0</b><span>판매중</span></button>
      <button class="stat" data-f="reserved"><b id="cRes">0</b><span>예약중</span></button>
      <button class="stat" data-f="sold"><b id="cSold">0</b><span>판매완료</span></button>
    </div>
    <div class="bar">
      <input class="input" id="search" type="search" placeholder="모델명·상품번호 검색">
    </div>
    <div class="list" id="list"></div>
  </main>
  <button class="btn btn-red add-btn" id="addBtn">＋ 새 폰 등록</button>
</div>

<!-- 등록/수정 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-top"><div class="wrap"><h2 id="sheetTitle">새 폰 등록</h2><button class="x" id="closeSheet" aria-label="닫기">✕</button></div></div>
  <form class="wrap" id="form" autocomplete="off">
    <div class="sec">
      <h3><span class="n">1</span>사진 <small style="font-weight:500;color:var(--muted)">첫 번째 사진이 대표 사진</small></h3>
      <div class="photos" id="photos"></div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <p class="hint">앞면 · 뒷면 · 옆면 · 흠집 부위를 찍어 올리면 손님이 믿고 사요. 사진은 자동으로 줄여서 올라가요.</p>
    </div>

    <div class="sec">
      <h3><span class="n">2</span>기본 정보</h3>
      <div class="field"><span>브랜드</span>
        <div class="seg" id="brandSeg"><button type="button" data-v="apple">아이폰</button><button type="button" data-v="samsung">갤럭시</button><button type="button" data-v="etc">기타</button></div>
      </div>
      <label class="field"><span>모델명 <small>영어로 쓰면 외국인 손님도 검색돼요</small></span><input class="input" id="model" list="modelList" required placeholder="예: iPhone 15 Pro"></label>
      <datalist id="modelList"></datalist>
      <div class="field"><span>용량</span>
        <div class="chips" id="storageChips"></div>
      </div>
      <label class="field"><span>색상</span><input class="input" id="color" placeholder="예: Natural Titanium, 블랙"></label>
      <div class="swatches" id="swatches"></div>
      <p class="hint">색 동그라미는 사진이 없을 때 그림 색상으로 쓰여요.</p>
    </div>

    <div class="sec">
      <h3><span class="n">3</span>상태</h3>
      <div class="field"><span>외관 등급</span>
        <div class="grades" id="grades"></div>
      </div>
      <div class="field"><span>배터리 성능 <small id="batLabel"></small></span>
        <input class="range" id="batteryRange" type="range" min="50" max="100" value="90">
        <div class="row2"><input class="input" id="battery" type="number" inputmode="numeric" min="0" max="100" placeholder="모르면 비워두세요"><button type="button" class="btn" id="batUnknown">모름</button></div>
      </div>
      <label class="check"><input type="checkbox" id="batteryReplaced">정품 새 배터리로 교체함</label>
    </div>

    <div class="sec">
      <h3><span class="n">4</span>가격</h3>
      <div class="row2">
        <label class="field"><span>판매가</span><span class="money"><input class="input" id="price" inputmode="numeric" required placeholder="0"></span></label>
        <label class="field"><span>시중가 <small>선택</small></span><span class="money"><input class="input" id="marketPrice" inputmode="numeric" placeholder="0"></span></label>
      </div>
      <div class="quick" id="quick"><button type="button" data-d="-10000">−1만</button><button type="button" data-d="10000">+1만</button><button type="button" data-d="50000">+5만</button><button type="button" data-d="100000">+10만</button></div>
      <div class="save-preview" id="savePreview" hidden></div>
    </div>

    <div class="sec">
      <h3><span class="n">5</span>구성품 · 설명</h3>
      <div class="chips" id="includeChips"></div>
      <label class="field" style="margin-top:14px"><span>설명 (한국어)</span><textarea class="input" id="noteKo" placeholder="예: 케이스 끼고 사용해서 기스 거의 없음. 기능 모두 정상."></textarea></label>
      <label class="field"><span>설명 (영어) <small>선택 · 비우면 외국어 화면에 한국어가 보여요</small></span><textarea class="input" id="noteEn" placeholder="e.g. Very clean, used with a case. Everything works."></textarea></label>
    </div>

    <div class="sec">
      <h3><span class="n">6</span>판매 상태 · 상품번호</h3>
      <div class="seg" id="statusSeg"><button type="button" data-v="sale">판매중</button><button type="button" data-v="reserved">예약중</button><button type="button" data-v="sold">판매완료</button></div>
      <div class="row2" style="margin-top:14px">
        <label class="field"><span>상품번호</span><input class="input" id="pid" required></label>
        <label class="field"><span>입고일</span><input class="input" id="arrived" type="date"></label>
      </div>
    </div>
    <div style="height:8px"></div>
  </form>
  <div class="sheet-foot"><div class="wrap">
    <button type="button" class="btn btn-danger" id="deleteBtn" hidden>삭제</button>
    <button type="button" class="btn btn-red" id="saveBtn">저장하고 사이트에 올리기</button>
  </div></div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="confirm-bg" id="confirmBox" hidden><div class="confirm"><p id="confirmText"></p><div class="acts"><button class="btn" id="confirmNo">취소</button><button class="btn btn-red" id="confirmYes">확인</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script>
(function () {
  'use strict';
  const CFG = window.SITE_CONFIG;
  const BUCKET = 'used-phones';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const won = n => (n == null || n === '' ? '-' : Number(n).toLocaleString('ko-KR') + '원');
  const toNum = v => { const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); return isNaN(n) ? null : n; };

  const MODELS = {
    apple: ['iPhone 18 Pro Max', 'iPhone 18 Pro', 'iPhone 17 Pro Max', 'iPhone 17 Pro', 'iPhone Air', 'iPhone 17', 'iPhone 17e', 'iPhone 16 Pro Max', 'iPhone 16 Pro', 'iPhone 16 Plus', 'iPhone 16', 'iPhone 16e', 'iPhone 15 Pro Max', 'iPhone 15 Pro', 'iPhone 15 Plus', 'iPhone 15', 'iPhone 14 Pro Max', 'iPhone 14 Pro', 'iPhone 14 Plus', 'iPhone 14', 'iPhone 13 Pro Max', 'iPhone 13 Pro', 'iPhone 13', 'iPhone 13 mini', 'iPhone 12 Pro', 'iPhone 12', 'iPhone SE (3rd)'],
    samsung: ['Galaxy S26 Ultra', 'Galaxy S26+', 'Galaxy S26', 'Galaxy S25 Ultra', 'Galaxy S25+', 'Galaxy S25', 'Galaxy S25 Edge', 'Galaxy S25 FE', 'Galaxy S24 Ultra', 'Galaxy S24+', 'Galaxy S24', 'Galaxy S24 FE', 'Galaxy S23 Ultra', 'Galaxy S23', 'Galaxy Z Fold8', 'Galaxy Z Flip8', 'Galaxy Z Fold7', 'Galaxy Z Flip7', 'Galaxy Z Fold6', 'Galaxy Z Flip6', 'Galaxy Z Fold5', 'Galaxy Z Flip5', 'Galaxy A56', 'Galaxy A36', 'Galaxy A35', 'Galaxy A25', 'Galaxy A16', 'Galaxy Jump5', 'Galaxy Quantum5'],
    etc: [],
  };
  const STORAGES = ['64GB', '128GB', '256GB', '512GB', '1TB'];
  const INCLUDES = ['본체', '충전기', 'C타입 케이블', '정품 박스', 'S펜', '케이스', '필름 부착'];
  const SWATCHES = ['#1d1d1f', '#f5f5f0', '#c8c8cc', '#bfa48a', '#e07a3f', '#f2c9d0', '#bde3d3', '#7e8fa6', '#2e3a55', '#6c5b9e', '#a3c4e8', '#c9b037', '#9b2335'];
  const GRADES = { S: ['최상', '사용감 거의 없음'], A: ['상', '미세한 생활기스'], B: ['중', '눈에 띄는 기스·찍힘 일부'], C: ['하', '사용감 많음, 기능 정상'] };
  const STATUS = { sale: '판매중', reserved: '예약중', sold: '판매완료' };

  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase) { $('setupView').hidden = false; return; }
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);

  let items = [];
  let filter = '';
  let draft = null;     // 편집 중인 상품
  let editingId = null;
  let signupMode = false;
  let uploading = 0;

  /* ---------- 공통 UI ---------- */
  let tt;
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2400); }
  function ask(text) {
    return new Promise(res => {
      $('confirmText').textContent = text; $('confirmBox').hidden = false;
      const done = v => { $('confirmBox').hidden = true; $('confirmYes').onclick = $('confirmNo').onclick = null; res(v); };
      $('confirmYes').onclick = () => done(true); $('confirmNo').onclick = () => done(false);
    });
  }
  function loginMsg(text, ok) { const m = $('loginMsg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.hidden = !text; }
  function friendly(err) {
    const m = (err && (err.message || err.error_description)) || String(err);
    if (/Invalid login/i.test(m)) return '이메일이나 비밀번호가 맞지 않아요.';
    if (/Email not confirmed/i.test(m)) return '메일함에서 가입 확인 메일의 링크를 먼저 눌러주세요.';
    if (/already registered/i.test(m)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
    if (/row-level security|permission|not authorized|403/i.test(m)) return '관리자 권한이 없는 계정이에요. 관리자 이메일로 로그인해 주세요.';
    if (/Password should be/i.test(m)) return '비밀번호는 6자 이상이어야 해요.';
    return m;
  }

  /* ---------- 로그인 ---------- */
  async function route() {
    const { data } = await sb.auth.getSession();
    const session = data.session;
    if (!session) { show('login'); return; }
    const { data: adm, error } = await sb.from('used_admins').select('email').limit(1);
    if (error || !adm || !adm.length) {
      show('login');
      loginMsg(session.user.email + ' 계정은 관리자로 등록되어 있지 않아요. 등록된 관리자 이메일로 로그인해 주세요.');
      await sb.auth.signOut();
      return;
    }
    show('app');
    load();
  }
  function show(v) { $('loginView').hidden = v !== 'login'; $('appView').hidden = v !== 'app'; }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    $('loginBtn').disabled = true; loginMsg('');
    try {
      if (signupMode) {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split('#')[0] } });
        if (error) throw error;
        if (data.session) { await route(); }
        else loginMsg('확인 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인해 주세요.', true);
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await route();
      }
    } catch (err) { loginMsg(friendly(err)); }
    $('loginBtn').disabled = false;
  });
  $('toggleSignup').addEventListener('click', () => {
    signupMode = !signupMode;
    $('loginTitle').textContent = signupMode ? '관리자 계정 만들기' : '관리자 로그인';
    $('loginDesc').textContent = signupMode ? '관리자로 등록된 이메일로만 상품을 관리할 수 있어요.' : 'KT 금왕점 중고폰 상품 관리';
    $('loginBtn').textContent = signupMode ? '계정 만들기' : '로그인';
    $('toggleSignup').textContent = signupMode ? '이미 계정이 있어요' : '처음이세요? 계정 만들기';
    $('password').autocomplete = signupMode ? 'new-password' : 'current-password';
    loginMsg('');
  });
  $('resetPw').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email) { loginMsg('이메일을 먼저 입력해 주세요.'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    loginMsg(error ? friendly(error) : '비밀번호 재설정 메일을 보냈어요.', !error);
  });
  sb.auth.onAuthStateChange(async (ev) => {
    if (ev === 'PASSWORD_RECOVERY') {
      const pw = window.prompt('새 비밀번호를 입력하세요 (6자 이상)');
      if (pw) { const { error } = await sb.auth.updateUser({ password: pw }); toast(error ? friendly(error) : '비밀번호를 바꿨어요.'); }
    }
  });
  $('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); show('login'); });

  /* ---------- 목록 ---------- */
  async function load() {
    const { data, error } = await sb.from('used_phones').select('*').order('arrived', { ascending: false }).order('created_at', { ascending: false });
    if (error) { toast(friendly(error)); return; }
    items = data || [];
    render();
  }
  function render() {
    $('cSale').textContent = items.filter(p => p.status === 'sale').length;
    $('cRes').textContent = items.filter(p => p.status === 'reserved').length;
    $('cSold').textContent = items.filter(p => p.status === 'sold').length;
    document.querySelectorAll('.stat').forEach(s => s.classList.toggle('on', s.dataset.f === filter));
    const q = $('search').value.trim().toLowerCase().replace(/\s+/g, '');
    const list = items.filter(p => (!filter || p.status === filter) && (!q || (p.model + p.id + (p.color || '') + (p.storage || '')).toLowerCase().replace(/\s+/g, '').includes(q)));
    if (!items.length) { $('list').innerHTML = '<div class="empty"><b>아직 등록된 폰이 없어요</b><br>오른쪽 아래 <b>＋ 새 폰 등록</b>을 눌러 첫 폰을 올려보세요.</div>'; return; }
    if (!list.length) { $('list').innerHTML = '<div class="empty">조건에 맞는 폰이 없어요.</div>'; return; }
    $('list').innerHTML = list.map(p => `
      <article class="item">
        ${p.images && p.images[0] ? `<img class="item-img" src="${esc(p.images[0])}" alt="" loading="lazy">` : '<div class="item-img">사진 없음</div>'}
        <div class="item-main">
          <div class="item-top"><span>${esc(p.id)}</span><span class="gtag g-${esc(p.grade)}">${esc(p.grade)}</span>${p.battery ? `<span>🔋${p.battery}%</span>` : ''}</div>
          <h3>${esc(p.model)}</h3>
          <div class="spec">${esc([p.storage, p.color].filter(Boolean).join(' · '))}</div>
          <div class="price">${won(p.price)}</div>
        </div>
        <div class="item-actions">
          <div class="seg" data-id="${esc(p.id)}">${Object.entries(STATUS).map(([k, v]) => `<button type="button" data-v="${k}" class="${p.status === k ? 'on' : ''}">${v}</button>`).join('')}</div>
          <button class="edit-btn" data-edit="${esc(p.id)}">수정</button>
        </div>
      </article>`).join('');
  }
  $('search').addEventListener('input', render);
  $('stats').addEventListener('click', e => { const b = e.target.closest('.stat'); if (!b) return; filter = filter === b.dataset.f ? '' : b.dataset.f; render(); });
  $('list').addEventListener('click', async e => {
    const ed = e.target.closest('[data-edit]');
    if (ed) { openEditor(items.find(p => p.id === ed.dataset.edit)); return; }
    const sb_ = e.target.closest('.seg[data-id] button');
    if (sb_) {
      const id = sb_.parentElement.dataset.id, v = sb_.dataset.v;
      const p = items.find(x => x.id === id); if (!p || p.status === v) return;
      const prev = p.status; p.status = v; render();
      const { error } = await sb.from('used_phones').update({ status: v }).eq('id', id);
      if (error) { p.status = prev; render(); toast(friendly(error)); } else toast(`${id} → ${STATUS[v]}`);
    }
  });

  /* ---------- 편집기 ---------- */
  function nextId() {
    const nums = items.map(p => parseInt(String(p.id).replace(/\D/g, ''), 10)).filter(n => !isNaN(n));
    return 'GW-' + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, '0');
  }
  function blank() {
    return { id: nextId(), brand: 'apple', model: '', storage: '128GB', color: '', color_hex: '#1d1d1f', grade: 'A', battery: null, battery_replaced: false, price: null, market_price: null, status: 'sale', images: [], includes: ['본체'], note_ko: '', note_en: '', arrived: new Date().toISOString().slice(0, 10) };
  }
  function openEditor(p) {
    editingId = p ? p.id : null;
    draft = JSON.parse(JSON.stringify(p || blank()));
    $('sheetTitle').textContent = p ? p.id + ' 수정' : '새 폰 등록';
    $('deleteBtn').hidden = !p;
    $('model').value = draft.model; $('color').value = draft.color || '';
    $('price').value = draft.price ? draft.price.toLocaleString('ko-KR') : '';
    $('marketPrice').value = draft.market_price ? draft.market_price.toLocaleString('ko-KR') : '';
    $('battery').value = draft.battery ?? ''; $('batteryRange').value = draft.battery ?? 90;
    $('batteryReplaced').checked = !!draft.battery_replaced;
    $('noteKo').value = draft.note_ko || ''; $('noteEn').value = draft.note_en || '';
    $('pid').value = draft.id; $('arrived').value = draft.arrived || '';
    paint();
    $('sheet').hidden = false; $('sheet').scrollTop = 0; document.body.classList.add('lock');
  }
  async function closeEditor(force) {
    if (!force && uploading) { toast('사진을 올리는 중이에요. 잠시만요.'); return; }
    $('sheet').hidden = true; document.body.classList.remove('lock'); draft = null;
  }
  function paint() {
    setSeg('brandSeg', draft.brand);
    setSeg('statusSeg', draft.status);
    $('modelList').innerHTML = (MODELS[draft.brand] || []).map(m => `<option value="${esc(m)}">`).join('');
    const st = STORAGES.includes(draft.storage) || !draft.storage ? STORAGES : STORAGES.concat(draft.storage);
    $('storageChips').innerHTML = st.map(s => `<button type="button" class="chip ${draft.storage === s ? 'on' : ''}" data-v="${esc(s)}">${esc(s)}</button>`).join('') + '<button type="button" class="chip" data-v="__custom">직접 입력</button>';
    $('swatches').innerHTML = SWATCHES.map(c => `<button type="button" class="sw ${draft.color_hex === c ? 'on' : ''}" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('') + `<label class="sw" style="background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);position:relative;overflow:hidden" title="다른 색"><input type="color" id="colorPick" value="${esc(draft.color_hex || '#cccccc')}" style="opacity:0;position:absolute;inset:0;width:100%;height:100%"></label>`;
    $('grades').innerHTML = Object.entries(GRADES).map(([k, v]) => `<button type="button" class="grade ${draft.grade === k ? 'on' : ''}" data-g="${k}"><b><span class="gtag g-${k}">${k}</span>${v[0]}</b><small>${v[1]}</small></button>`).join('');
    $('includeChips').innerHTML = INCLUDES.map(s => `<button type="button" class="chip ${draft.includes.includes(s) ? 'on' : ''}" data-v="${esc(s)}">${esc(s)}</button>`).join('');
    $('batLabel').textContent = draft.battery == null ? '(모름)' : draft.battery + '%';
    paintPhotos(); paintSave();
  }
  function setSeg(id, v) { document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.add('plain')); if (id === 'statusSeg') document.querySelectorAll('#statusSeg button').forEach(b => b.classList.remove('plain')); }
  function paintSave() {
    const p = toNum($('price').value), m = toNum($('marketPrice').value);
    const el = $('savePreview');
    if (p && m && m > p) { el.hidden = false; el.textContent = `사이트에 "${(m - p).toLocaleString('ko-KR')}원 저렴"으로 표시돼요`; } else el.hidden = true;
  }
  function paintPhotos() {
    const imgs = draft.images;
    $('photos').innerHTML = imgs.map((src, i) => `
      <div class="ph">${src.startsWith('uploading:') ? `<div class="prog">올리는 중…</div>` : `<img src="${esc(src)}" alt="">`}
        ${i === 0 ? '<span class="main">대표</span>' : ''}
        ${src.startsWith('uploading:') ? '' : `<div class="ctl"><button type="button" data-mv="${i}" data-d="-1" aria-label="앞으로">◀</button><button type="button" data-rm="${i}" aria-label="삭제">✕</button><button type="button" data-mv="${i}" data-d="1" aria-label="뒤로">▶</button></div>`}
      </div>`).join('') +
      `<label class="ph-add" for="fileInput"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>사진 찍기 / 선택</label>`;
  }

  // 이벤트: 편집기 컨트롤
  $('brandSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; draft.brand = b.dataset.v; paint(); });
  $('statusSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; draft.status = b.dataset.v; setSeg('statusSeg', draft.status); });
  $('storageChips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.v === '__custom') { const v = window.prompt('용량을 입력하세요 (예: 2TB)'); if (v) draft.storage = v.trim().toUpperCase(); }
    else draft.storage = b.dataset.v;
    paint();
  });
  $('swatches').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; draft.color_hex = b.dataset.c; paint(); });
  $('swatches').addEventListener('input', e => { if (e.target.id === 'colorPick') { draft.color_hex = e.target.value; document.querySelectorAll('#swatches .sw').forEach(s => s.classList.remove('on')); } });
  $('grades').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; draft.grade = b.dataset.g; paint(); });
  $('includeChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const v = b.dataset.v; draft.includes = draft.includes.includes(v) ? draft.includes.filter(x => x !== v) : draft.includes.concat(v); paint(); });
  $('batteryRange').addEventListener('input', e => { draft.battery = +e.target.value; $('battery').value = draft.battery; $('batLabel').textContent = draft.battery + '%'; });
  $('battery').addEventListener('input', e => { const n = toNum(e.target.value); draft.battery = n == null ? null : Math.min(100, n); if (n != null) $('batteryRange').value = n; $('batLabel').textContent = n == null ? '(모름)' : n + '%'; });
  $('batUnknown').addEventListener('click', () => { draft.battery = null; $('battery').value = ''; $('batLabel').textContent = '(모름)'; });
  ['price', 'marketPrice'].forEach(id => $(id).addEventListener('input', e => {
    const n = toNum(e.target.value); e.target.value = n == null ? '' : n.toLocaleString('ko-KR'); paintSave();
  }));
  $('quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const n = Math.max(0, (toNum($('price').value) || 0) + +b.dataset.d); $('price').value = n.toLocaleString('ko-KR'); paintSave(); });
  $('closeSheet').addEventListener('click', () => closeEditor());
  $('addBtn').addEventListener('click', () => openEditor(null));

  // 사진
  $('photos').addEventListener('click', e => {
    const mv = e.target.closest('[data-mv]'), rm = e.target.closest('[data-rm]');
    if (mv) { const i = +mv.dataset.mv, j = i + +mv.dataset.d; if (j < 0 || j >= draft.images.length) return; const a = draft.images; [a[i], a[j]] = [a[j], a[i]]; paintPhotos(); }
    if (rm) { draft.images.splice(+rm.dataset.rm, 1); paintPhotos(); }
  });
  $('fileInput').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []); e.target.value = '';
    for (const f of files) {
      const token = 'uploading:' + Math.random().toString(36).slice(2);
      draft.images.push(token); paintPhotos(); uploading++;
      try {
        const blob = await shrink(f);
        const path = `${(draft.id || 'new').replace(/[^A-Za-z0-9-]/g, '')}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
        const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
        if (error) throw error;
        const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        if (draft) { const k = draft.images.indexOf(token); if (k > -1) draft.images[k] = url; }
      } catch (err) {
        if (draft) draft.images = draft.images.filter(x => x !== token);
        toast('사진 업로드 실패: ' + friendly(err));
      }
      uploading--; if (draft) paintPhotos();
    }
  });
  // 긴 변 1600px, JPEG로 줄이기 (폰 카메라 원본은 너무 큼)
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1600, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => (b ? resolve(b) : reject(new Error('이미지 변환 실패'))), 'image/jpeg', 0.84);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이 사진 형식은 읽을 수 없어요. JPG/PNG로 올려주세요.')); };
      img.src = url;
    });
  }

  // 저장
  $('saveBtn').addEventListener('click', async () => {
    if (uploading) { toast('사진을 올리는 중이에요. 잠시 후 저장해 주세요.'); return; }
    const row = {
      id: $('pid').value.trim(), brand: draft.brand, model: $('model').value.trim(), storage: draft.storage || null,
      color: $('color').value.trim() || null, color_hex: draft.color_hex, grade: draft.grade,
      battery: draft.battery, battery_replaced: $('batteryReplaced').checked,
      price: toNum($('price').value), market_price: toNum($('marketPrice').value), status: draft.status,
      images: draft.images.filter(s => !s.startsWith('uploading:')), includes: draft.includes,
      note_ko: $('noteKo').value.trim() || null, note_en: $('noteEn').value.trim() || null,
      arrived: $('arrived').value || new Date().toISOString().slice(0, 10),
    };
    if (!row.model) { toast('모델명을 입력해 주세요.'); $('model').focus(); return; }
    if (row.price == null) { toast('판매가를 입력해 주세요.'); $('price').focus(); return; }
    if (!row.id) { toast('상품번호를 입력해 주세요.'); return; }
    if (items.some(p => p.id === row.id && p.id !== editingId)) { toast('이미 있는 상품번호예요: ' + row.id); return; }
    $('saveBtn').disabled = true;
    let error;
    if (editingId && editingId !== row.id) {
      ({ error } = await sb.from('used_phones').insert(row));
      if (!error) ({ error } = await sb.from('used_phones').delete().eq('id', editingId));
    } else if (editingId) {
      ({ error } = await sb.from('used_phones').update(row).eq('id', editingId));
    } else {
      ({ error } = await sb.from('used_phones').insert(row));
    }
    $('saveBtn').disabled = false;
    if (error) { toast('저장 실패: ' + friendly(error)); return; }
    toast(editingId ? '수정했어요. 사이트에 바로 반영됐어요.' : '등록했어요. 사이트에 바로 올라갔어요.');
    closeEditor(true); load();
  });

  // 삭제
  $('deleteBtn').addEventListener('click', async () => {
    if (!editingId) return;
    const ok = await ask(`${editingId} 상품을 완전히 지울까요? 팔린 폰은 "판매완료"로 두면 사이트에 판매 기록이 남아요.`);
    if (!ok) return;
    const p = items.find(x => x.id === editingId);
    const { error } = await sb.from('used_phones').delete().eq('id', editingId);
    if (error) { toast('삭제 실패: ' + friendly(error)); return; }
    const paths = (p && p.images || []).map(u => u.split('/object/public/' + BUCKET + '/')[1]).filter(Boolean);
    if (paths.length) await sb.storage.from(BUCKET).remove(paths);
    toast('삭제했어요.'); closeEditor(true); load();
  });

  route();
})();
</script>
</body>
</html>
