<!doctype html>
<!-- 카톡·문자 링크 미리보기 이미지(1200x630) 원본. 수정 후 README의 명령으로 images/og.jpg 다시 만들기 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Pretendard, 'Malgun Gothic', sans-serif; background: #111214; color: #fff; position: relative; }
  .photo { position: absolute; inset: 0 0 0 auto; width: 700px; background: url('../images/store/storefront.jpg') center 40% / cover no-repeat; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #111214 0%, #111214 44%, rgba(17,18,20,.86) 54%, rgba(17,18,20,.25) 72%, rgba(17,18,20,0) 100%); }
  .content { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 18px; }
  .logo svg { width: 112px; height: auto; }
  .logo span { font-size: 26px; font-weight: 700; color: #c9ccd1; padding-left: 18px; border-left: 2px solid #3b3f45; line-height: 1.2; }
  h1 { margin-top: 34px; font-size: 92px; font-weight: 900; letter-spacing: -0.05em; line-height: 1.02; }
  h1 em { font-style: normal; color: #ff2a3a; display: block; }
  p { margin-top: 24px; font-size: 30px; font-weight: 600; color: #e3e5e8; letter-spacing: -0.03em; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chip { padding: 12px 20px; border-radius: 999px; background: #E60012; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .chip.line { background: transparent; border: 2px solid rgba(255,255,255,.4); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #E60012; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="fade"></div>
  <div class="bar"></div>
  <div class="content">
    <div class="logo">
      <svg viewBox="0 0 69.73 56.89"><path fill="#fff" d="M22.25,33.92l16.05-19.75h-8.75c-3.93,0-6.62,1.2-9.01,3.99l-8.45,10.39V0H3.61C1.62,0,0,1.62,0,3.62v53.27h8.48c2,0,3.61-1.62,3.61-3.62v-14.17l6.87,8.43,5.84,7.19c1.18,1.48,2.73,2.16,4.32,2.16h11.83l-7.65-9.39-11.05-13.58ZM59.34,46.84c-1.78,0-3.24-1.46-3.24-3.25V0h-8.48c-1.99,0-3.62,1.62-3.62,3.61v42.25c0,6.53,4.51,11.03,11.04,11.03h9.32c2,0,3.62-1.62,3.62-3.62v-6.44h-8.64Z"/><path fill="#ED1C24" d="M69.73,19.04v-8.02s-.75.79-.75.79c-.03.01-2.3,2.33-8.82,2.33h-30.83c-4.87,0-7.17,1.98-8.91,4.13l-.95,1.17s-.06.07-.09.1l-6.12,7.53c2.23-1.68,5.27-2.69,8.38-2.69h38.51c4.67,0,9.16-1.37,9.53-4.87.05-.29.04-.47.04-.47Z"/></svg>
      <span>공식대리점<br>금왕점</span>
    </div>
    <h1>KT 금왕점<em>중고폰</em></h1>
    <p>KT 대리점이 직접 파는 믿을 수 있는 중고폰</p>
    <div class="chips"><span class="chip">문제 시 7일 내 교환 · 환불</span><span class="chip line">3단계 전문 검수</span></div>
  </div>
</body>
</html>
